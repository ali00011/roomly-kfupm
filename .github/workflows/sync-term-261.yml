name: Refresh KFUPM TERM 261 data

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the project
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Fetch all TERM 261 departments
        run: npm run sync:261

      - name: Commit changed data
        run: |
          if git diff --quiet -- data/course-offerings-261.json; then
            echo "No course-offering changes found."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/course-offerings-261.json
          git commit -m "chore: refresh KFUPM TERM 261 data"
          git push
